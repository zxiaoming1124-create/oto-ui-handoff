/* A restrained glass navigation surface; controls share the same neutral tokens. */
body{background:#eeeeef}

.main{position:relative;z-index:1;width:100%;height:100%;padding:38px 48px 44px 244px;background:transparent;margin:0;border:0;border-radius:0}
.api-inline-field{display:flex;align-items:center;gap:6px;width:100%;min-height:48px;padding:5px 6px 5px 12px;border:1px solid #d4d4d4;border-radius:var(--radius);background:#fff}

.recording-settings-group{--trigger-inset:12px}
.recording-settings-group .dropdown-trigger{padding-inline-start:var(--trigger-inset)}
.cancel-recording-row .keycaps{margin-inline-start:calc(var(--trigger-inset) + 1px)}
.keycap .key-name{line-height:11px}
.keycap .key-symbol{line-height:15px}

<body>

<div class="app-shell"><div class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="window-title">oto</span></div><div class="app-body">
<aside class="sidebar"><div class="brand"><span class="brand-mark"><img class="brand-logo" src="assets/oto-logo.png" width="28" height="32" alt=""></span><span class="brand-name">oto</span></div><nav aria-label="Main navigation"><button class="nav-item" data-route="settings" aria-label="Settings" title="Settings"><span data-icon="settings"></span><span>Settings</span></button><button class="nav-item active" data-route="history" aria-label="History" title="History"><span data-icon="history"></span><span>History</span></button></nav><div class="api-sidebar-footer"><div class="api-sidebar-label">API billing</div><nav aria-label="API billing links"><button type="button" class="nav-item" aria-label="Credit balance" title="View your remaining API credits on OpenAI."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V5a2 2 0 0 1 2-2h12v4M4 7h15a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1Z"/><path d="M20 11h-5v5h5M16.5 13.5h.01"/></svg><span>Credit balance</span><svg class="sidebar-external" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6"/></svg></button><button type="button" class="nav-item" aria-label="Usage &amp; costs" title="View your API usage and spending on OpenAI."><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v16h16M8 16v-4M13 16V8M18 16V5"/></svg><span>Usage &amp; costs</span><svg class="sidebar-external" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6"/></svg></button></nav></div></aside>

<script>
window.otoIcons=function(name,size=20){const copyId='oto-copy-'+(window.otoIconSerial=(window.otoIconSerial||0)+1);const p={mic:'<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/>',settings:'<path d="M4 7h2m6 0h8M4 17h8m6 0h2"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',history:'<path d="M3.5 8.5A8.5 8.5 0 1 1 4 17.2M3.5 3.5v5h5M12 7.5V12l3 2"/>',chevron:'<path d="m6 9 6 6 6-6"/>',copy:'<defs><mask id="'+copyId+'" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24"><rect width="24" height="24" fill="white" stroke="none"/><rect x="8" y="8" width="12" height="12" rx="2" fill="black" stroke="black" stroke-width="1.5"/></mask></defs><rect x="4" y="4" width="12" height="12" rx="2" mask="url(#'+copyId+')"/><rect x="8" y="8" width="12" height="12" rx="2"/>',trash:'<path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/>',search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',stop:'<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',edit:'<path d="m16 3 5 5M4 20l4.5-1 12-12a1.4 1.4 0 0 0 0-2l-1.5-1.5a1.4 1.4 0 0 0-2 0l-12 12L4 20Z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 8.5a2.5 2.5 0 1 1 4.1 1.9c-1.2.8-1.6 1.1-1.6 2.6M12 16.5h.01"/>',external:'<path d="M14 4h6v6M20 4l-9 9M10 4H4v16h16v-6"/>',reset:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',eyeOff:'<path d="m3 3 18 18M10.5 5.1 12 5c6 0 10 7 10 7s-1.1 1.9-3 3.7M6.3 6.3C3.6 8.2 2 12 2 12s4 7 10 7c1.7 0 3.2-.5 4.5-1.2M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'};return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(p[name]||p.mic)+'</svg>'};document.querySelectorAll('[data-icon]').forEach(n=>n.outerHTML=otoIcons(n.dataset.icon,n.dataset.icon==='reset'?14:19));

window.otoKeycaps=function(value){const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names={Control:['⌃','control'],Meta:['⌘','command'],Alt:['⌥','option'],AltRight:['⌥','option'],Shift:['⇧','shift']};return '<span class="keycaps" aria-label="'+escape(value==='AltRight'?'Right Option':value.replace(/\+/g,' + '))+'">'+value.split('+').map(p=>{if(p==='Off')return '';if(p==='Fn')return '<kbd class="keycap" aria-hidden="true"><span class="key-symbol"></span><span class="key-name">fn</span></kbd>';if(names[p])return '<kbd class="keycap modifier'+(p==='AltRight'?' key-right-option':'')+'" aria-hidden="true"><span class="key-symbol">'+names[p][0]+'</span><span class="key-name">'+names[p][1]+'</span></kbd>'+(p==='AltRight'?'<span class="key-side">Right</span>':'');if(p==='Space')return '<kbd class="keycap key-space" aria-hidden="true"><span class="key-symbol"></span><span class="key-name">space</span></kbd>';if(p==='Escape')return '<kbd class="keycap" aria-hidden="true"><span class="key-symbol"></span><span class="key-name">esc</span></kbd>';return '<kbd class="keycap key-letter" aria-hidden="true">'+escape(p)+'</kbd>';}).join('')+'</span>';};
</script><script src="app.js"></script>
